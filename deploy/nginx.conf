# TLS is terminated by the existing reverse proxy, not this container.
# No source tree, settings, credentials or calendar data are served from disk.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events { worker_connections 512; }

http {
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/wasm wasm;
        application/json json;
        application/manifest+json webmanifest;
        image/png png;
        image/svg+xml svg;
        text/plain txt md;
    }
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    access_log off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $uri $asset_cache_control {
        default "no-cache";
        /sw.js "no-store";
        /healthz "no-store";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # A stricter COOP or COEP imposed at NPM can break Google popups.
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' data:; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; worker-src 'self'; manifest-src 'self'" always;
        add_header Cache-Control $asset_cache_control always;

        # This is a static host, NOT an upload/API endpoint.
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
}
