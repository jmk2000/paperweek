# Choose compose.npm.yml OR compose.lan.yml as an overlay.
name: paperweek
services:
  paperweek:
    image: paperweek-server:local
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    env_file:
      - .env.private
    environment:
      PAPERWEEK_PUBLIC_URL: ${PAPERWEEK_PUBLIC_URL:?Run tools/configure_backend.py first}
    volumes:
      - paperweek-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    expose:
      - "8080"
volumes:
  paperweek-data:
