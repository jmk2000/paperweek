name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld cmake
      - name: Privacy heuristic
        run: python3 tools/privacy_check.py --tracked
      - name: Native core tests
        run: |
          cmake -S . -B build/core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core --parallel 4
          ctest --test-dir build/core --output-on-failure
      - name: Build portable preview and test WebAssembly
        run: |
          bash tools/build-preview.sh
          node --test tests/*.test.mjs
      - name: Install pinned Emscripten toolchain
        run: bash tools/install-emsdk.sh "$RUNNER_TEMP/emsdk"
      - name: Build actual LVGL WebAssembly frontend
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash tools/build-web.sh
      - name: Install browser test tools
        run: |
          python3 -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/test-venv/bin/playwright" install --with-deps chromium
      - name: Test actual HTTP-rendered LVGL frontend
        run: "$RUNNER_TEMP/test-venv/bin/python" tools/http_smoke.py --backend lvgl
      - uses: actions/upload-artifact@v4
        with:
          name: paperweek-lvgl-web
          path: dist-lvgl/
          if-no-files-found: error
